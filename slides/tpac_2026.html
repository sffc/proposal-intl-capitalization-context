<h2 id="untangling-terminology">Untangling Terminology</h2>
<p>Standards discussions often stall because <strong>&quot;capitalize&quot;</strong> and <strong>&quot;titlecase&quot;</strong> refer to one of several distinct operations:</p>
<table>
<thead>
<tr>
<th style="text-align:left">Term</th>
<th style="text-align:left">Precise Meaning</th>
<th style="text-align:left">Examples</th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:left"><strong>Character Titlecase Mapping</strong></td>
<td style="text-align:left">Maps a single letter/digraph according to Unicode titlecase rules (<code>Lt</code>)</td>
<td style="text-align:left"><code>ǆ</code> <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.025ex;" xmlns="http://www.w3.org/2000/svg" width="2.262ex" height="1.181ex" role="img" focusable="false" viewBox="0 -511 1000 522"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mo"><path data-c="2192" d="M56 237T56 250T70 270H835Q719 357 692 493Q692 494 692 496T691 499Q691 511 708 511H711Q720 511 723 510T729 506T732 497T735 481T743 456Q765 389 816 336T935 261Q944 258 944 250Q944 244 939 241T915 231T877 212Q836 186 806 152T761 85T740 35T732 4Q730 -6 727 -8T711 -11Q691 -11 691 0Q691 7 696 25Q728 151 835 230H70Q56 237 56 250Z"></path></g></g></g></svg></mjx-container> <code>ǅ</code>, <code>ﬁ</code> <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.025ex;" xmlns="http://www.w3.org/2000/svg" width="2.262ex" height="1.181ex" role="img" focusable="false" viewBox="0 -511 1000 522"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mo"><path data-c="2192" d="M56 237T56 250T70 270H835Q719 357 692 493Q692 494 692 496T691 499Q691 511 708 511H711Q720 511 723 510T729 506T732 497T735 481T743 456Q765 389 816 336T935 261Q944 258 944 250Q944 244 939 241T915 231T877 212Q836 186 806 152T761 85T740 35T732 4Q730 -6 727 -8T711 -11Q691 -11 691 0Q691 7 696 25Q728 151 835 230H70Q56 237 56 250Z"></path></g></g></g></svg></mjx-container> <code>Fi</code><br />Dutch <code>ij</code> <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.025ex;" xmlns="http://www.w3.org/2000/svg" width="2.262ex" height="1.181ex" role="img" focusable="false" viewBox="0 -511 1000 522"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mo"><path data-c="2192" d="M56 237T56 250T70 270H835Q719 357 692 493Q692 494 692 496T691 499Q691 511 708 511H711Q720 511 723 510T729 506T732 497T735 481T743 456Q765 389 816 336T935 261Q944 258 944 250Q944 244 939 241T915 231T877 212Q836 186 806 152T761 85T740 35T732 4Q730 -6 727 -8T711 -11Q691 -11 691 0Q691 7 696 25Q728 151 835 230H70Q56 237 56 250Z"></path></g></g></g></svg></mjx-container> <code>IJ</code>, Georgian <code>ა</code> <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.025ex;" xmlns="http://www.w3.org/2000/svg" width="2.262ex" height="1.181ex" role="img" focusable="false" viewBox="0 -511 1000 522"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mo"><path data-c="2192" d="M56 237T56 250T70 270H835Q719 357 692 493Q692 494 692 496T691 499Q691 511 708 511H711Q720 511 723 510T729 506T732 497T735 481T743 456Q765 389 816 336T935 261Q944 258 944 250Q944 244 939 241T915 231T877 212Q836 186 806 152T761 85T740 35T732 4Q730 -6 727 -8T711 -11Q691 -11 691 0Q691 7 696 25Q728 151 835 230H70Q56 237 56 250Z"></path></g></g></g></svg></mjx-container> <code>ა</code> (no-op)</td>
</tr>
<tr>
<td style="text-align:left"><strong>First-Letter Uppercase</strong></td>
<td style="text-align:left">A broken, naive method (<code>s[0].toUpperCase() + s.slice(1)</code>) that many developers use to implement titlecasing</td>
<td style="text-align:left"><code>&quot;ijsland&quot;</code> <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.025ex;" xmlns="http://www.w3.org/2000/svg" width="2.262ex" height="1.181ex" role="img" focusable="false" viewBox="0 -511 1000 522"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mo"><path data-c="2192" d="M56 237T56 250T70 270H835Q719 357 692 493Q692 494 692 496T691 499Q691 511 708 511H711Q720 511 723 510T729 506T732 497T735 481T743 456Q765 389 816 336T935 261Q944 258 944 250Q944 244 939 241T915 231T877 212Q836 186 806 152T761 85T740 35T732 4Q730 -6 727 -8T711 -11Q691 -11 691 0Q691 7 696 25Q728 151 835 230H70Q56 237 56 250Z"></path></g></g></g></svg></mjx-container> <img class="emoji" draggable="false" alt="❌" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/274c.svg" data-marp-twemoji=""/> <code>&quot;Ijsland&quot;</code><br /><code>&quot;თბილისი&quot;</code> <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.025ex;" xmlns="http://www.w3.org/2000/svg" width="2.262ex" height="1.181ex" role="img" focusable="false" viewBox="0 -511 1000 522"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mo"><path data-c="2192" d="M56 237T56 250T70 270H835Q719 357 692 493Q692 494 692 496T691 499Q691 511 708 511H711Q720 511 723 510T729 506T732 497T735 481T743 456Q765 389 816 336T935 261Q944 258 944 250Q944 244 939 241T915 231T877 212Q836 186 806 152T761 85T740 35T732 4Q730 -6 727 -8T711 -11Q691 -11 691 0Q691 7 696 25Q728 151 835 230H70Q56 237 56 250Z"></path></g></g></g></svg></mjx-container> <img class="emoji" draggable="false" alt="❌" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/274c.svg" data-marp-twemoji=""/> <code>&quot;Თბილისი&quot;</code></td>
</tr>
<tr>
<td style="text-align:left"><strong>First-Word Titlecase</strong></td>
<td style="text-align:left">Apply titlecase mapping to the first ~letter of a string (<code>titlecase-firstword</code>, trailing case unchanged)</td>
<td style="text-align:left"><code>&quot;español de España&quot;</code> <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.025ex;" xmlns="http://www.w3.org/2000/svg" width="2.262ex" height="1.181ex" role="img" focusable="false" viewBox="0 -511 1000 522"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mo"><path data-c="2192" d="M56 237T56 250T70 270H835Q719 357 692 493Q692 494 692 496T691 499Q691 511 708 511H711Q720 511 723 510T729 506T732 497T735 481T743 456Q765 389 816 336T935 261Q944 258 944 250Q944 244 939 241T915 231T877 212Q836 186 806 152T761 85T740 35T732 4Q730 -6 727 -8T711 -11Q691 -11 691 0Q691 7 696 25Q728 151 835 230H70Q56 237 56 250Z"></path></g></g></g></svg></mjx-container> <code>&quot;Español de España&quot;</code><br /><code>&quot;«bonjour»&quot;</code> <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.025ex;" xmlns="http://www.w3.org/2000/svg" width="2.262ex" height="1.181ex" role="img" focusable="false" viewBox="0 -511 1000 522"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mo"><path data-c="2192" d="M56 237T56 250T70 270H835Q719 357 692 493Q692 494 692 496T691 499Q691 511 708 511H711Q720 511 723 510T729 506T732 497T735 481T743 456Q765 389 816 336T935 261Q944 258 944 250Q944 244 939 241T915 231T877 212Q836 186 806 152T761 85T740 35T732 4Q730 -6 727 -8T711 -11Q691 -11 691 0Q691 7 696 25Q728 151 835 230H70Q56 237 56 250Z"></path></g></g></g></svg></mjx-container> <code>&quot;«Bonjour»&quot;</code></td>
</tr>
<tr>
<td style="text-align:left"><strong>Sentence Case</strong></td>
<td style="text-align:left">Same as First-Word Titlecase but applied to every sentence in a string</td>
<td style="text-align:left"><code>&quot;hello world. ¡hola mundo!&quot;</code> <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.025ex;" xmlns="http://www.w3.org/2000/svg" width="2.262ex" height="1.181ex" role="img" focusable="false" viewBox="0 -511 1000 522"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mo"><path data-c="2192" d="M56 237T56 250T70 270H835Q719 357 692 493Q692 494 692 496T691 499Q691 511 708 511H711Q720 511 723 510T729 506T732 497T735 481T743 456Q765 389 816 336T935 261Q944 258 944 250Q944 244 939 241T915 231T877 212Q836 186 806 152T761 85T740 35T732 4Q730 -6 727 -8T711 -11Q691 -11 691 0Q691 7 696 25Q728 151 835 230H70Q56 237 56 250Z"></path></g></g></g></svg></mjx-container> <code>&quot;Hello world. ¡Hola mundo!&quot;</code></td>
</tr>

<td style="text-align:left"><strong>Every-Word Titlecase</strong></td>
<td style="text-align:left">Apply titlecase mapping to the first ~letter of every ~word in a string (CSS <code>capitalize</code>)</td>
<td style="text-align:left"><code>&quot;español de España&quot;</code> <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.025ex;" xmlns="http://www.w3.org/2000/svg" width="2.262ex" height="1.181ex" role="img" focusable="false" viewBox="0 -511 1000 522"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mo"><path data-c="2192" d="M56 237T56 250T70 270H835Q719 357 692 493Q692 494 692 496T691 499Q691 511 708 511H711Q720 511 723 510T729 506T732 497T735 481T743 456Q765 389 816 336T935 261Q944 258 944 250Q944 244 939 241T915 231T877 212Q836 186 806 152T761 85T740 35T732 4Q730 -6 727 -8T711 -11Q691 -11 691 0Q691 7 696 25Q728 151 835 230H70Q56 237 56 250Z"></path></g></g></g></svg></mjx-container> <code>&quot;Español De España&quot;</code><br /><code>&quot;out-of-the-box&quot;</code> <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.025ex;" xmlns="http://www.w3.org/2000/svg" width="2.262ex" height="1.181ex" role="img" focusable="false" viewBox="0 -511 1000 522"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mo"><path data-c="2192" d="M56 237T56 250T70 270H835Q719 357 692 493Q692 494 692 496T691 499Q691 511 708 511H711Q720 511 723 510T729 506T732 497T735 481T743 456Q765 389 816 336T935 261Q944 258 944 250Q944 244 939 241T915 231T877 212Q836 186 806 152T761 85T740 35T732 4Q730 -6 727 -8T711 -11Q691 -11 691 0Q691 7 696 25Q728 151 835 230H70Q56 237 56 250Z"></path></g></g></g></svg></mjx-container> <code>&quot;Out-Of-The-Box&quot;</code></td>

<td style="text-align:left"><strong>Editorial Title Case</strong></td>

<td style="text-align:left"><code>&quot;the war of the worlds&quot;</code> <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.025ex;" xmlns="http://www.w3.org/2000/svg" width="2.262ex" height="1.181ex" role="img" focusable="false" viewBox="0 -511 1000 522"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mo"><path data-c="2192" d="M56 237T56 250T70 270H835Q719 357 692 493Q692 494 692 496T691 499Q691 511 708 511H711Q720 511 723 510T729 506T732 497T735 481T743 456Q765 389 816 336T935 261Q944 258 944 250Q944 244 939 241T915 231T877 212Q836 186 806 152T761 85T740 35T732 4Q730 -6 727 -8T711 -11Q691 -11 691 0Q691 7 696 25Q728 151 835 230H70Q56 237 56 250Z"></path></g></g></g></svg></mjx-container> <code>&quot;The War of the Worlds&quot;</code></td>

<h2 id="state-in-the-web-platform">State in the Web Platform</h2>
<div class="columns">
<div>
<h3 id="1-css--html">1. CSS &amp; HTML</h3>
<ul>
<li><strong><code>text-transform: capitalize;</code></strong>
<ul>
<li>Applies <em>Every-Word Titlecase</em> (<code>U_TITLECASE_NO_LOWERCASE</code>) to all text.</li>
<li><em>Stopwords (<code>CSS Text 3 §2.1</code>):</em> Word boundaries are UA-dependent (<code>UAX #29</code> suggested); spec notes <em>&quot;Authors cannot depend on <code>capitalize</code> to follow language-specific titlecasing conventions (such as skipping articles in English)&quot;</em> — <strong>no engine skips stopwords</strong>.</li>
</ul>
</li>
<li><strong><code>::first-letter</code>:</strong> Block containers only (ignored on inline <code>&lt;span&gt;</code>, <code>&lt;a&gt;</code>).</li>
<li><strong>HTML:</strong> <code>autocapitalize</code> only hints mobile virtual keyboards; <code>&lt;html lang&gt;</code> is used by CSS <strong>but ignored by JS <code>toLocaleUpperCase()</code></strong>.</li>
<li><strong>Open CSS Issues:</strong>
<ul>
<li><a href="https://github.com/w3c/csswg-drafts/issues/8893">w3c/csswg-drafts#8893</a> — First-Word / Sentence Case</li>
<li><a href="https://github.com/w3c/csswg-drafts/issues/12526">w3c/csswg-drafts#12526</a> — Editorial Title Case</li>
</ul>
</li>
</ul>
</div>
<div>
<h3 id="2-javascript-string--intl">2. JavaScript (<code>String</code> &amp; <code>Intl</code>)</h3>
<ul>
<li><strong>No native support</strong> for titlecase mapping (<code>toUpperCase()</code> / <code>toLowerCase()</code> only).</li>
<li><strong><code>Intl</code> formatters</strong> return a single default casing with <strong>no UI context option</strong>.</li>
<li><strong>What developers do instead:</strong>
<ul>
<li><strong>100,000+ GitHub files</strong> (and <strong>12,750+ <code>google3</code> files</strong>) hardcode naive first-letter uppercase (<a href="https://stackoverflow.com/questions/1026069">SO #1026069</a>, <strong>4.7M+ views</strong>, baked into TypeScript <code>Capitalize&lt;S&gt;</code>, Vue, MUI, Angular, Closure).</li>
<li><strong>1.7M+ CSS/TSX/Vue files</strong> apply <code>text-transform: capitalize</code>.</li>
</ul>
</li>
<li><strong>Open JS / <code>Intl</code> Issues:</strong>
<ul>
<li><a href="https://github.com/tc39/ecma402/issues/294">tc39/ecma402#294</a> — Titlecase / Case Mapping in JS</li>
<li><a href="https://github.com/tc39/ecma402/issues/355">tc39/ecma402#355</a> — Contextual Capitalization in <code>Intl</code></li>
</ul>
</li>
</ul>
</div>
</div>

<h2 id="why-titlecase-first-letter-uppercase">Why Titlecase <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.486ex;" xmlns="http://www.w3.org/2000/svg" width="1.76ex" height="2.106ex" role="img" focusable="false" viewBox="0 -716 778 931"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mo"><path data-c="2260" d="M166 -215T159 -215T147 -212T141 -204T139 -197Q139 -190 144 -183L306 133H70Q56 140 56 153Q56 168 72 173H327L406 327H72Q56 332 56 347Q56 360 70 367H426Q597 702 602 707Q605 716 618 716Q625 716 630 712T636 703T638 696Q638 692 471 367H707Q722 359 722 347Q722 336 708 328L451 327L371 173H708Q722 163 722 153Q722 140 707 133H351Q175 -210 170 -212Q166 -215 159 -215Z"></path></g></g></g></svg></mjx-container> First-Letter Uppercase</h2>
<div class="columns">
<div>
<h3 id="how-developers-do-it-wrong-today">How Developers Do It Wrong Today</h3>
<ul>
<li><strong>In JavaScript (<code>100k+</code> GitHub files):</strong><pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-js"><span class="hljs-comment">// Slices UTF-16 code unit 0 and uppercases it:</span>
<span class="hljs-keyword">const</span> <span class="hljs-title function_">capitalize</span> = s =&gt;
  s.<span class="hljs-title function_">charAt</span>(<span class="hljs-number">0</span>).<span class="hljs-title function_">toUpperCase</span>() + s.<span class="hljs-title function_">slice</span>(<span class="hljs-number">1</span>);
</code></pre>
</li>
<li><strong>In CSS (<code>::first-letter</code> hack):</strong><pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-css"><span class="hljs-comment">/* Ignored on inline &lt;span&gt;/&lt;a&gt; without inline-block! */</span>
<span class="hljs-selector-class">.label</span> { <span class="hljs-attribute">display</span>: inline-block; }
<span class="hljs-selector-class">.label</span><span class="hljs-selector-pseudo">::first-letter</span> {
  <span class="hljs-attribute">text-transform</span>: uppercase;
}
</code></pre>
</li>
</ul>
</div>
<div>
<h3 id="what-true-titlecase-mapping-actually-requires">What True Titlecase Mapping Actually Requires</h3>
<ol>
<li><strong>Leading Adjustment (<code>Auto</code>):</strong> Advance past <code>«</code>, <code>¿</code>, quotes, and Bidi isolates (<code>U+2068</code>); keep <code>&quot;49ers&quot;</code> &amp; Dutch <code>&quot;'s-Gravenhage&quot;</code> intact.</li>
<li><strong>Unicode <code>Titlecase_Mapping</code> (<mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.486ex;" xmlns="http://www.w3.org/2000/svg" width="1.76ex" height="2.106ex" role="img" focusable="false" viewBox="0 -716 778 931"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mo"><path data-c="2260" d="M166 -215T159 -215T147 -212T141 -204T139 -197Q139 -190 144 -183L306 133H70Q56 140 56 153Q56 168 72 173H327L406 327H72Q56 332 56 347Q56 360 70 367H426Q597 702 602 707Q605 716 618 716Q625 716 630 712T636 703T638 696Q638 692 471 367H707Q722 359 722 347Q722 336 708 328L451 327L371 173H708Q722 163 722 153Q722 140 707 133H351Q175 -210 170 -212Q166 -215 159 -215Z"></path></g></g></g></svg></mjx-container> <code>Uppercase</code>):</strong> Code-point &amp; grapheme awareness (surrogates, NFD combining marks), digraphs (<code>ǆ</code> <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.025ex;" xmlns="http://www.w3.org/2000/svg" width="2.262ex" height="1.181ex" role="img" focusable="false" viewBox="0 -511 1000 522"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mo"><path data-c="2192" d="M56 237T56 250T70 270H835Q719 357 692 493Q692 494 692 496T691 499Q691 511 708 511H711Q720 511 723 510T729 506T732 497T735 481T743 456Q765 389 816 336T935 261Q944 258 944 250Q944 244 939 241T915 231T877 212Q836 186 806 152T761 85T740 35T732 4Q730 -6 727 -8T711 -11Q691 -11 691 0Q691 7 696 25Q728 151 835 230H70Q56 237 56 250Z"></path></g></g></g></svg></mjx-container> <code>ǅ</code>), ligatures (<code>ﬁ</code> <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.025ex;" xmlns="http://www.w3.org/2000/svg" width="2.262ex" height="1.181ex" role="img" focusable="false" viewBox="0 -511 1000 522"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mo"><path data-c="2192" d="M56 237T56 250T70 270H835Q719 357 692 493Q692 494 692 496T691 499Q691 511 708 511H711Q720 511 723 510T729 506T732 497T735 481T743 456Q765 389 816 336T935 261Q944 258 944 250Q944 244 939 241T915 231T877 212Q836 186 806 152T761 85T740 35T732 4Q730 -6 727 -8T711 -11Q691 -11 691 0Q691 7 696 25Q728 151 835 230H70Q56 237 56 250Z"></path></g></g></g></svg></mjx-container> <code>Fi</code>), and <strong>Georgian <code>ka</code> identity (no-op!)</strong>.</li>
<li><strong>Locale Tailorings:</strong> Dutch <code>ij</code> <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.025ex;" xmlns="http://www.w3.org/2000/svg" width="2.262ex" height="1.181ex" role="img" focusable="false" viewBox="0 -511 1000 522"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mo"><path data-c="2192" d="M56 237T56 250T70 270H835Q719 357 692 493Q692 494 692 496T691 499Q691 511 708 511H711Q720 511 723 510T729 506T732 497T735 481T743 456Q765 389 816 336T935 261Q944 258 944 250Q944 244 939 241T915 231T877 212Q836 186 806 152T761 85T740 35T732 4Q730 -6 727 -8T711 -11Q691 -11 691 0Q691 7 696 25Q728 151 835 230H70Q56 237 56 250Z"></path></g></g></g></svg></mjx-container> <code>IJ</code>, Turkish <code>i</code> <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.025ex;" xmlns="http://www.w3.org/2000/svg" width="2.262ex" height="1.181ex" role="img" focusable="false" viewBox="0 -511 1000 522"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mo"><path data-c="2192" d="M56 237T56 250T70 270H835Q719 357 692 493Q692 494 692 496T691 499Q691 511 708 511H711Q720 511 723 510T729 506T732 497T735 481T743 456Q765 389 816 336T935 261Q944 258 944 250Q944 244 939 241T915 231T877 212Q836 186 806 152T761 85T740 35T732 4Q730 -6 727 -8T711 -11Q691 -11 691 0Q691 7 696 25Q728 151 835 230H70Q56 237 56 250Z"></path></g></g></g></svg></mjx-container> <code>İ</code>, Greek initial <em>tonos</em> retention (<code>&quot;άνθρωπος&quot;</code> <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.025ex;" xmlns="http://www.w3.org/2000/svg" width="2.262ex" height="1.181ex" role="img" focusable="false" viewBox="0 -511 1000 522"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mo"><path data-c="2192" d="M56 237T56 250T70 270H835Q719 357 692 493Q692 494 692 496T691 499Q691 511 708 511H711Q720 511 723 510T729 506T732 497T735 481T743 456Q765 389 816 336T935 261Q944 258 944 250Q944 244 939 241T915 231T877 212Q836 186 806 152T761 85T740 35T732 4Q730 -6 727 -8T711 -11Q691 -11 691 0Q691 7 696 25Q728 151 835 230H70Q56 237 56 250Z"></path></g></g></g></svg></mjx-container> <code>&quot;Άνθρωπος&quot;</code>, whereas <code>uppercase</code> strips accents <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.025ex;" xmlns="http://www.w3.org/2000/svg" width="2.262ex" height="1.181ex" role="img" focusable="false" viewBox="0 -511 1000 522"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mo"><path data-c="2192" d="M56 237T56 250T70 270H835Q719 357 692 493Q692 494 692 496T691 499Q691 511 708 511H711Q720 511 723 510T729 506T732 497T735 481T743 456Q765 389 816 336T935 261Q944 258 944 250Q944 244 939 241T915 231T877 212Q836 186 806 152T761 85T740 35T732 4Q730 -6 727 -8T711 -11Q691 -11 691 0Q691 7 696 25Q728 151 835 230H70Q56 237 56 250Z"></path></g></g></g></svg></mjx-container> <code>&quot;ΑΝΘΡΩΠΟΣ&quot;</code>), Lithuanian dot removal, Irish <code>ga</code> prefixes.</li>
<li><strong>Trailing Case (<code>Unchanged</code>):</strong> Preserve <code>&quot;MacDonald&quot;</code>, <code>&quot;iPhone&quot;</code>, <code>&quot;España&quot;</code>, <code>&quot;COVID-19&quot;</code>.</li>
</ol>

<h2 id="character--script-failures-str0touppercase-is-not-titlecase">Character &amp; Script Failures: <code>str[0].toUpperCase()</code> Is Not Titlecase</h2>
<p><code>str[0].toUpperCase() + str.slice(1)</code> applies <strong><code>Uppercase_Mapping</code> to UTF-16 code unit 0</strong> instead of <strong><code>Titlecase_Mapping</code> to the first word</strong>:</p>

<h2 id="surrogates-leading-punctuation-bw--trailing-case">Surrogates, Leading Punctuation, <code>\b\w</code>, &amp; Trailing Case</h2>
<div class="columns">
<div>
<h3 id="1-surrogates-combining-marks--leading-punctuation">1. Surrogates, Combining Marks, &amp; Leading Punctuation</h3>
<ul>
<li><strong>UTF-16 Surrogates (9 bicameral scripts):</strong> In <strong>Adlam</strong> (<code>&quot;𞤢𞤤𞤢𞤲𞤣&quot;</code> <em>Sunday</em>), <strong>Deseret</strong>, <strong>Osage</strong>, <code>str[0]</code> is a lone high surrogate (<code>\uD83A</code>) — <code>.toUpperCase()</code> is a <strong>silent no-op</strong> (<code>camelcase#117</code>), and <code>&lt;span&gt;{str[0]}&lt;/span&gt;{str.slice(1)}</code> renders <code>U+FFFD</code>!</li>

<h3 id="2-why-first-letter-fails--css-leaks">2. Why <code>::first-letter</code> Fails &amp; CSS Leaks</h3>
<ul>
<li><strong>Why <code>.label::first-letter</code> doesn't save us:</strong>
<ul>
<li><strong>Ignored on inline elements (<code>&lt;span&gt;</code>, <code>&lt;a&gt;</code>, <code>&lt;label&gt;</code>)</strong> (<code>CSS Pseudo-Elements 4 §2.2</code>).</li>

<li>Even <code>::first-letter { text-transform: capitalize }</code> fails in Blink on Dutch <code>&quot;ijsland&quot;</code> <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.025ex;" xmlns="http://www.w3.org/2000/svg" width="2.262ex" height="1.181ex" role="img" focusable="false" viewBox="0 -511 1000 522"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mo"><path data-c="2192" d="M56 237T56 250T70 270H835Q719 357 692 493Q692 494 692 496T691 499Q691 511 708 511H711Q720 511 723 510T729 506T732 497T735 481T743 456Q765 389 816 336T935 261Q944 258 944 250Q944 244 939 241T915 231T877 212Q836 186 806 152T761 85T740 35T732 4Q730 -6 727 -8T711 -11Q691 -11 691 0Q691 7 696 25Q728 151 835 230H70Q56 237 56 250Z"></path></g></g></g></svg></mjx-container> <strong><code>&quot;Ijsland&quot;</code></strong> (<code>crbug.com/1172333</code>) and <code>&quot;«\u00A0bonjour&quot;</code> (<code>crbug.com/41270370</code>).</li>
</ul>
</li>
<li><strong>Accessibility, Clipboard, &amp; Non-CSS Sinks:</strong>
<ul>
<li><strong>Screen readers (<code>w3c/accname#239</code>):</strong> <code>&lt;button style=&quot;text-transform: uppercase&quot;&gt;Call us&lt;/button&gt;</code> <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.025ex;" xmlns="http://www.w3.org/2000/svg" width="2.262ex" height="1.181ex" role="img" focusable="false" viewBox="0 -511 1000 522"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mo"><path data-c="2192" d="M56 237T56 250T70 270H835Q719 357 692 493Q692 494 692 496T691 499Q691 511 708 511H711Q720 511 723 510T729 506T732 497T735 481T743 456Q765 389 816 336T935 261Q944 258 944 250Q944 244 939 241T915 231T877 212Q836 186 806 152T761 85T740 35T732 4Q730 -6 727 -8T711 -11Q691 -11 691 0Q691 7 696 25Q728 151 835 230H70Q56 237 56 250Z"></path></g></g></g></svg></mjx-container> announced as <strong>&quot;Call U.S.&quot;</strong></li>
<li><strong>Clipboard &amp; <code>innerText</code> (<code>webkit.org/b/43202</code>):</strong> Mutates copied text.</li>
<li><strong>Cannot reach:</strong> <code>&lt;title&gt;</code>, <code>&lt;option&gt;</code>, <code>aria-label</code>, <code>&lt;canvas&gt;</code>, <code>Notification</code>.</li>
</ul>
</li>
</ul>

<h2 id="capitalization-according-to-cldr-and-unicode">Capitalization According to CLDR and Unicode</h2>
<div class="columns">
<div>
<h3 id="phase-1-contextual-decision">Phase 1: Contextual Decision</h3>
<p><strong>Input:</strong> Locale, UI Context, Lexical Category<br />
<strong>Output:</strong> Algorithm Choice <em>(via CLDR <code>&lt;contextTransforms&gt;</code>)</em></p>
<p><em>Example UI Contexts (<code>UTS #35</code> + UI):</em></p>
<ul>
<li><strong>Middle of sentence</strong> (<code>middle-of-sentence</code> — CLDR default)</li>
<li><strong>Beginning of sentence</strong> (<code>beginning-of-sentence</code>)</li>
<li><strong>Menu / list item</strong> (<code>uiListOrMenu</code>)</li>
<li><strong>Standalone label / header</strong> (<code>stand-alone</code>)</li>
<li><strong>Headline / Title</strong> (Editorial UI chrome)</li>
</ul>
<p><em>Example Lexical Categories:</em></p>
<ul>
<li><strong>CLDR nouns:</strong> Month/day name, Language/region name, Relative date (<code>&quot;yesterday&quot;</code>), Currency/unit</li>
<li><strong>Person name</strong> (Always <code>no-change</code>)</li>
<li><strong>Prose / UI label</strong></li>
</ul>
</div>
<div>
<h3 id="phase-2-case-map-execution">Phase 2: Case Map Execution</h3>
<p><strong>Input:</strong> Locale, String, Algorithm Choice<br />
<strong>Output:</strong> Case-Mapped String <em>(Part 1!)</em></p>
<p><em>Algorithm Choices:</em></p>
<ul>
<li><strong><code>no-change</code>:</strong> Leave string as-is <em>(mid-sentence, Swedish standalone months, French menu months, person names)</em></li>
<li><strong><code>First-Word Titlecase</code> (<code>titlecase-firstword</code>):</strong> <code>ICU4X TitlecaseMapper::titlecase_segment</code> / <code>ICU4C U_TITLECASE_WHOLE_STRING</code> with <code>TrailingCase::Unchanged</code> &amp; <code>LeadingAdjustment::Auto</code> <em>(zero <code>BreakIterator</code> cost!)</em></li>
<li><strong><code>Sentence Case</code>:</strong> First-Word Titlecase per <code>UAX #29</code> sentence</li>
<li><strong><code>Every-Word Titlecase</code>:</strong> Titlecase per <code>UAX #29</code> word (CSS <code>capitalize</code>)</li>
<li><strong><code>Editorial Title Case</code>:</strong> Every-Word Titlecase skipping stopwords (<code>of</code>, <code>the</code>, <code>de</code>)</li>
</ul>
</div>
</div>
<footer>Capitalization, Titlecasing, and Presentational Case Mapping — W3C TPAC 2026</footer>

<h2 id="why-unconditional-first-word-casing-fails-contexttransforms">Why Unconditional First-Word Casing Fails (<code>&lt;contextTransforms&gt;</code>)</h2>
<p>Developers who notice CSS <code>capitalize</code> hits every word switch to JS (as Spanish devs noted in comments: <em>&quot;Con <code>capitalize</code> de CSS quedaba 'Septiembre De 2026'&quot;</em>) and hardcode <strong>First-Word Casing for every locale and UI slot</strong>:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-js"><span class="hljs-comment">// Found across dozens of GitHub calendar, datepicker, and i18n utilities:</span>
<span class="hljs-keyword">function</span> <span class="hljs-title function_">formatMonthLabel</span>(<span class="hljs-params">date, locale</span>) {
  <span class="hljs-keyword">const</span> s = date.<span class="hljs-title function_">toLocaleDateString</span>(locale, { <span class="hljs-attr">month</span>: <span class="hljs-string">&#x27;long&#x27;</span>, <span class="hljs-attr">year</span>: <span class="hljs-string">&#x27;numeric&#x27;</span> });
  <span class="hljs-keyword">return</span> <span class="hljs-title function_">capitalizeFirstWord</span>(s, locale); <span class="hljs-comment">// <img class="emoji" draggable="false" alt="❌" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/274c.svg" data-marp-twemoji=""/> Runs for EVERY locale &amp; UI context!</span>
}
</code></pre>
<p><strong>Why neither CSS (<code>text-transform: first-word</code>) nor unconditional JS can make the Phase 1 decision for <code>Intl</code> data:</strong></p>
<table>
<thead>
<tr>
<th style="text-align:left">Item &amp; UI Context</th>
<th style="text-align:center">Spanish (<code>es</code>)</th>
<th style="text-align:center">French (<code>fr</code>)</th>
<th style="text-align:center">Czech (<code>cs</code>)</th>
<th style="text-align:center">Swedish (<code>sv</code>) / Finnish (<code>fi</code>)</th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:left"><strong>Month in Calendar Header (<code>stand-alone</code>)</strong></td>
<td style="text-align:center"><code>Septiembre</code> (Cap)</td>
<td style="text-align:center"><code>Septembre</code> (Cap)</td>
<td style="text-align:center"><strong><code>září</code> (<code>no-change</code>)</strong></td>
<td style="text-align:center"><strong><code>september</code> / <code>syyskuu</code> (<code>no-change</code>)</strong></td>
</tr>
<tr>
<td style="text-align:left"><strong>Month in <code>&lt;select&gt;</code> Menu (<code>uiListOrMenu</code>)</strong></td>
<td style="text-align:center"><code>Septiembre</code> (Cap)</td>
<td style="text-align:center"><strong><code>septembre</code> (<code>no-change</code>)</strong></td>
<td style="text-align:center"><code>Září</code> (Cap)</td>
<td style="text-align:center"><strong><code>september</code> / <code>syyskuu</code> (<code>no-change</code>)</strong></td>
</tr>
<tr>
<td style="text-align:left"><strong>Language in <code>&lt;select&gt;</code> Menu (<code>uiListOrMenu</code>)</strong></td>
<td style="text-align:center"><code>Español</code> (Cap)</td>
<td style="text-align:center"><code>Français</code> (Cap)</td>
<td style="text-align:center"><code>Čeština</code> (Cap)</td>
<td style="text-align:center"><code>Svenska</code> / <code>Suomi</code> (Cap)</td>
</tr>
<tr>
<td style="text-align:left"><strong>Language Standalone (<code>stand-alone</code>)</strong></td>
<td style="text-align:center"><code>Español</code> (Cap)</td>
<td style="text-align:center"><strong><code>français</code> (<code>no-change</code>)</strong></td>
<td style="text-align:center"><code>Čeština</code> (Cap)</td>
<td style="text-align:center"><code>Svenska</code> / <strong><code>suomi</code> (<code>no-change</code>)</strong></td>
</tr>
<tr>
<td style="text-align:left"><strong>In Running Text (<code>middle-of-sentence</code>)</strong></td>
<td style="text-align:center"><strong><code>septiembre</code></strong></td>
<td style="text-align:center"><strong><code>septembre</code></strong></td>
<td style="text-align:center"><strong><code>září</code></strong></td>
<td style="text-align:center"><strong><code>september</code> / <code>syyskuu</code></strong></td>
</tr>
</tbody>
</table>

<h2 id="how-intl-leaves-browsers--locales-inconsistent-today">How <code>Intl</code> Leaves Browsers &amp; Locales Inconsistent Today</h2>
<p>CLDR stores terms in <strong>middle-of-sentence</strong> form (<code>&quot;enero&quot;</code>, <code>&quot;janvier&quot;</code>, <code>&quot;español&quot;</code>, <code>&quot;русский&quot;</code>) and uses <code>&lt;contextTransforms&gt;</code> (compiled in ICU to a tiny 2-bit flag vector per category) for UI contexts. Because <code>ECMA-402</code> has not exposed context (<code>ecma402#355</code>):</p>
<div class="columns">
<div>
<h3 id="1-cross-browser-divergence-in-intldisplaynames">1. Cross-Browser Divergence in <code>Intl.DisplayNames</code></h3>
<ul>
<li><strong>V8 (Chrome):</strong> passes <code>UDISPCTX_CAPITALIZATION_NONE</code></li>
<li><strong>SpiderMonkey (Firefox) &amp; JSC (Safari):</strong> pass <code>UDISPCTX_CAPITALIZATION_FOR_STANDALONE</code></li>
</ul>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-js"><span class="hljs-keyword">new</span> <span class="hljs-title class_">Intl</span>.<span class="hljs-title class_">DisplayNames</span>([<span class="hljs-string">&#x27;es&#x27;</span>], { <span class="hljs-attr">type</span>: <span class="hljs-string">&#x27;language&#x27;</span> })
  .<span class="hljs-title function_">of</span>(<span class="hljs-string">&#x27;es&#x27;</span>);
<span class="hljs-comment">// Chrome:         &quot;español&quot; (lowercase)</span>
<span class="hljs-comment">// Firefox/Safari: &quot;Español&quot; (Capitalized)</span>

<span class="hljs-keyword">new</span> <span class="hljs-title class_">Intl</span>.<span class="hljs-title class_">DisplayNames</span>([<span class="hljs-string">&#x27;fr&#x27;</span>], { <span class="hljs-attr">type</span>: <span class="hljs-string">&#x27;language&#x27;</span> })
  .<span class="hljs-title function_">of</span>(<span class="hljs-string">&#x27;fr&#x27;</span>);
<span class="hljs-comment">// ALL browsers:   &quot;français&quot; (lowercase!)</span>
<span class="hljs-comment">// Why? CLDR &#x27;fr&#x27; (and &#x27;fi&#x27;, &#x27;da&#x27;) only capitalizes</span>
<span class="hljs-comment">// languages in uiListOrMenu, not stand-alone!</span>
</code></pre>
</div>
<div>
<h3 id="2-real-world-pain-in-production-uis">2. Real-World Pain in Production UIs</h3>
<ul>
<li><strong>Perplexity Language Picker (<code>ecma402#355</code>):</strong><br />
Across ~50 interface languages in Chrome, <code>Intl.DisplayNames</code> returns <strong>27 lowercase</strong> (<code>&quot;español&quot;</code>, <code>&quot;français&quot;</code>, <code>&quot;русский&quot;</code>, <code>&quot;polski&quot;</code>, <code>&quot;čeština&quot;</code>, <code>&quot;suomi&quot;</code>) and <strong>~23 capitalized</strong> (<code>&quot;English&quot;</code>, <code>&quot;Deutsch&quot;</code>, <code>&quot;Nederlands&quot;</code>, <code>&quot;Türkçe&quot;</code>).</li>
<li><strong>Project Fluent (<code>fluent#299</code>) &amp; FormatJS (<code>#1527</code>):</strong><br />
Maintainers declined to add custom casing filters, pointing to <code>ecma402#355</code> as the missing platform primitive.</li>
</ul>
</div>
</div>

<h2 id="what-are-developers-actually-capitalizing-github-study">What Are Developers Actually Capitalizing? (GitHub Study)</h2>
<p>Across <strong>563 classified JS hits</strong> (400 real call sites) + <strong>~190 localized <code>Intl</code> call sites</strong> + <strong>1,000 CSS <code>.capitalize</code> fragments</strong> + <strong>2,000+ multilingual human-text lines</strong>:</p>
<table>
<thead>
<tr>
<th style="text-align:left">What Is Being Capitalized</th>
<th style="text-align:center">Share of JS Sample (+ CSS Usage)</th>
<th style="text-align:left">Which Phase &amp; Platform Primitive It Needs</th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:left"><strong>Internal keys/enums/statuses <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.025ex;" xmlns="http://www.w3.org/2000/svg" width="2.262ex" height="1.181ex" role="img" focusable="false" viewBox="0 -511 1000 522"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mo"><path data-c="2192" d="M56 237T56 250T70 270H835Q719 357 692 493Q692 494 692 496T691 499Q691 511 708 511H711Q720 511 723 510T729 506T732 497T735 481T743 456Q765 389 816 336T935 261Q944 258 944 250Q944 244 939 241T915 231T877 212Q836 186 806 152T761 85T740 35T732 4Q730 -6 727 -8T711 -11Q691 -11 691 0Q691 7 696 25Q728 151 835 230H70Q56 237 56 250Z"></path></g></g></g></svg></mjx-container> UI labels, chips, tabs, headers, &amp; translated strings (<code>$t('files')</code>)</strong></td>
<td style="text-align:center"><strong>51% of JS hits</strong><br /><em>(+ 33% of Vue <code>$t()</code> <code>.capitalize</code>)</em></td>
<td style="text-align:left"><strong>Phase 2 (<code>titlecase-firstword</code>):</strong> CSS <code>text-transform: first-word</code> (<code>#8893</code>) or JS (<code>#294</code>, <code>trailingCase: 'unchanged'</code>)</td>
</tr>
<tr>
<td style="text-align:left"><strong>API/DB phrases (<code>weather[0].description</code>), Go/Rust <code>error.message</code> toasts, transcripts, MF2</strong></td>
<td style="text-align:center"><strong>14.5% of JS hits</strong><br /><em>(1,908 weather + 106 error files; 0% lower tail!)</em></td>
<td style="text-align:left"><strong>Phase 2 in JS (<code>#294</code>):</strong> Single-span capitalization with <code>leadingAdjustment: 'auto'</code> &amp; <code>trailingCase: 'unchanged'</code></td>
</tr>
<tr>
<td style="text-align:left"><strong><code>Intl</code> / date-library outputs (<code>DateTimeFormat</code>, <code>DisplayNames</code>, <code>RelativeTimeFormat</code>)</strong></td>
<td style="text-align:center"><strong>~1% random JS</strong><br /><em>(~10–15% TS file ceiling + ~25–30% of CSS date/calendar hits)</em></td>
<td style="text-align:left"><strong>Phase 1 + 2 in <code>Intl</code> (<code>#355</code>):</strong> CLDR <code>&lt;contextTransforms&gt;</code> (<code>standalone</code>, <code>ui-list-or-menu</code>, <code>beginning-of-sentence</code>) + <strong>CLDR data audit</strong></td>
</tr>
<tr>
<td style="text-align:left"><strong>Person &amp; place names (<code>nombre</code>, <code>prenom</code>, <code>isim</code>)</strong></td>
<td style="text-align:center"><strong>6.5% of JS hits</strong><br /><em>(only group using <code>.toLowerCase()</code>!)</em></td>
<td style="text-align:left"><strong><code>no-change</code>:</strong> Do not case-normalize names; use UTS #35 Part 8 <code>initialPattern</code> (<code>Intl.PersonNames</code>) for initials</td>
</tr>
<tr>
<td style="text-align:left"><strong>Code / identifier generation (<code>PascalCase</code>, <code>on${Key}</code>)</strong></td>
<td style="text-align:center"><strong>26% of JS hits</strong></td>
<td style="text-align:left">ASCII <code>s[0].toUpperCase() + s.slice(1)</code> <em>(locale-insensitive, already works)</em></td>
</tr>
</tbody>
</table>
<blockquote>
<p><strong>Key Takeaway:</strong> Neither <code>Intl</code> (<code>#355</code>), nor CSS (<code>#8893</code>), nor a JS primitive (<code>#294</code>) can solve this alone—each covers a distinct slice of the Web, and all three share the <strong>same Phase 2 execution</strong>.</p>
</blockquote>
<footer>Capitalization, Titlecasing, and Presentational Case Mapping — W3C TPAC 2026</footer>

<h2 id="solution-track-1-css-css-text--accessibility-alignment-phase-2">Solution Track 1: CSS (<code>css-text</code>) &amp; Accessibility Alignment (Phase 2)</h2>
<div class="columns">
<div>
<h3 id="1-standardize-text-transform-first-word--sentence-csswg-drafts8893">1. Standardize <code>text-transform: first-word</code> / <code>sentence</code> (<code>csswg-drafts#8893</code>)</h3>
<ul>
<li>Direct declarative primitive for <strong>First-Word Titlecase</strong> (<code>titlecase-firstword</code>):
<ul>
<li>Applies Unicode <code>Titlecase_Mapping</code> + <code>TrailingCase::Unchanged</code> + <code>LeadingAdjustment::Auto</code> to the first word of an element.</li>
<li><strong>Works on inline elements (<code>&lt;span&gt;</code>, <code>&lt;a&gt;</code>, <code>&lt;label&gt;</code>)</strong> as well as blocks — eliminating <code>display: inline-block</code> <code>::first-letter</code> hacks and Greek <em>tonos</em> / Georgian <em>Mtavruli</em> bugs.</li>
<li>Replaces <code>.capitalize</code> on UI headings, chips, badges, and translated strings (<code>&quot;Nos services numériques&quot;</code>).</li>
</ul>
</li>
<li><em>What about Editorial Title Case (<code>#12526</code>)?</em> Stop words (<code>of</code>, <code>the</code>) are style-guide-specific (AP vs. Chicago); leave to userland or custom <code>@text-transform</code> (<code>#3132</code>).</li>
</ul>
</div>
<div>
<h3 id="2-fix-tailoring-interop-perf--leaks">2. Fix Tailoring Interop, Perf, &amp; Leaks</h3>
<ul>
<li><strong>Shared segment fast-path:</strong> Avoid Blink's 4.3% Speedometer 3 regression (<code>crbug.com/420998400</code> when shipping Dutch <code>IJ</code> in <code>crbug.com/41248541</code>) by caching <code>BreakIterator</code> for <code>capitalize</code> and using zero-breaker segment titlecasing (<code>ICU4X titlecase_segment</code> / <code>ICU4C U_TITLECASE_WHOLE_STRING</code>) for <code>first-word</code>.</li>
<li><strong>Language tailorings &amp; word boundaries:</strong> Align engines on Dutch <code>IJ</code>, Irish <code>ga</code> prefix mutations (<code>an t-uisce</code> <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.025ex;" xmlns="http://www.w3.org/2000/svg" width="2.262ex" height="1.181ex" role="img" focusable="false" viewBox="0 -511 1000 522"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mo"><path data-c="2192" d="M56 237T56 250T70 270H835Q719 357 692 493Q692 494 692 496T691 499Q691 511 708 511H711Q720 511 723 510T729 506T732 497T735 481T743 456Q765 389 816 336T935 261Q944 258 944 250Q944 244 939 241T915 231T877 212Q836 186 806 152T761 85T740 35T732 4Q730 -6 727 -8T711 -11Q691 -11 691 0Q691 7 696 25Q728 151 835 230H70Q56 237 56 250Z"></path></g></g></g></svg></mjx-container> <code>AN tUISCE</code>, currently Gecko-only), and UAX #29 word boundaries (<code>foo.bar</code>, <code>cancel·lar</code>).</li>
<li><strong>Fix Accessibility &amp; Clipboard Leaks:</strong> Do not expose visual <code>text-transform</code> mutations to <code>accname</code> (<code>w3c/accname#239</code>) or Safari plain-text clipboard (<code>webkit.org/b/43202</code>).</li>
</ul>
</div>
</div>
<footer>Capitalization, Titlecasing, and Presentational Case Mapping — W3C TPAC 2026</footer>
</section>

<h2 id="solution-track-2-contextual-capitalization-in-intl-355-phase-1--2">Solution Track 2: Contextual Capitalization in <code>Intl</code> (<code>#355</code>) (Phase 1 + 2)</h2>
<div class="columns">
<div>
<h3 id="1-expose-capitalization-option-in-intl">1. Expose <code>capitalization</code> Option in <code>Intl</code></h3>
<p>For CLDR nouns (<code>DateTimeFormat</code>, <code>DisplayNames</code>, <code>RelativeTimeFormat</code>), <strong>only <code>Intl</code> knows the lexical category</strong> needed for Phase 1:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-js"><span class="hljs-comment">// Standalone calendar header:</span>
<span class="hljs-keyword">new</span> <span class="hljs-title class_">Intl</span>.<span class="hljs-title class_">DateTimeFormat</span>(locale, {
  <span class="hljs-attr">month</span>: <span class="hljs-string">&#x27;long&#x27;</span>, <span class="hljs-attr">year</span>: <span class="hljs-string">&#x27;numeric&#x27;</span>,
  <span class="hljs-attr">capitalization</span>: <span class="hljs-string">&#x27;standalone&#x27;</span>,
  <span class="hljs-comment">// &#x27;middle-of-sentence&#x27; (default) | &#x27;beginning-of-sentence&#x27;</span>
  <span class="hljs-comment">// | &#x27;ui-list-or-menu&#x27; | &#x27;standalone&#x27;</span>
}).<span class="hljs-title function_">format</span>(date);
<span class="hljs-comment">// es -&gt; &quot;Septiembre de 2026&quot;</span>
<span class="hljs-comment">// sv -&gt; &quot;september 2026&quot; (respects Swedish no-change!)</span>

<span class="hljs-comment">// Language picker menu:</span>
<span class="hljs-keyword">new</span> <span class="hljs-title class_">Intl</span>.<span class="hljs-title class_">DisplayNames</span>([locale], {
  <span class="hljs-attr">type</span>: <span class="hljs-string">&#x27;language&#x27;</span>,
  <span class="hljs-attr">capitalization</span>: <span class="hljs-string">&#x27;ui-list-or-menu&#x27;</span>,
}).<span class="hljs-title function_">of</span>(<span class="hljs-string">&#x27;es-ES&#x27;</span>);
<span class="hljs-comment">// fr -&gt; &quot;Espagnol d’Espagne&quot; (vs &quot;espagnol d’Espagne&quot;)</span>
</code></pre>
<ul>
<li>Resolves Chrome vs. Firefox/Safari <code>Intl.DisplayNames</code> divergence by specifying <code>'middle-of-sentence'</code> as the default.</li>
</ul>
</div>
<div>
<h3 id="2-co-requisite-cldr--icu-data-audit">2. Co-Requisite: CLDR &amp; ICU Data Audit</h3>
<p>Our GitHub call-site audit revealed missing CLDR <code>&lt;contextTransforms&gt;</code> flags where native speakers expect capitalization:</p>
<ol>
<li><strong>Portuguese (<code>pt</code>) months:</strong> #1 locale in our GitHub study (27 <code>pt-BR</code> sites capitalizing <code>&quot;Setembro de 2026&quot;</code>), yet <code>pt.xml</code> has <code>days</code> and <code>relative</code> <strong>but is missing <code>month-*</code></strong>!</li>
<li><strong>Language pickers (<code>languages</code>):</strong> Missing <code>uiListOrMenu</code> in <strong><code>pl</code> (<code>polski</code>), <code>hu</code> (<code>magyar</code>), <code>ca</code> (<code>català</code>), <code>ro</code> (<code>română</code>), <code>bg</code> (<code>български</code>), <code>sr</code>, <code>sl</code>, <code>lt</code>, <code>lv</code>, <code>et</code>, <code>is</code></strong> (half of Perplexity's 27 lowercase languages!).</li>
<li><strong>Relative dates (<code>relative</code>):</strong> Missing in <strong><code>fr</code> (<code>hier</code>), <code>es</code> (<code>ayer</code>), <code>it</code> (<code>ieri</code>)</strong>; and ICU4C <code>RelativeDateTimeFormatter</code> (<code>reldatefmt.cpp:816</code>) currently ignores <code>STANDALONE</code> &amp; <code>UI_LIST_OR_MENU</code>!</li>
</ol>
</div>
</div>
<footer>Capitalization, Titlecasing, and Presentational Case Mapping — W3C TPAC 2026</footer>

<h2 id="solution-track-3-js-case-mapping-building-block-294-phase-2">Solution Track 3: JS Case Mapping Building Block (<code>#294</code>) (Phase 2)</h2>
<p>How do we fix the <strong>90%+ of JS call sites</strong> that transform non-<code>Intl</code> strings (weather/API text, error toasts, <code>&lt;title&gt;</code>, <code>&lt;option&gt;</code>, <code>aria-label</code>, MF2 messages) while addressing all TG2 vendor objections?</p>
<div class="columns">
<div>
<h3 id="single-span-primitive--intlsegmenter">Single-Span Primitive + <code>Intl.Segmenter</code></h3>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-js"><span class="hljs-comment">// 1. Direct replacement for s[0].toUpperCase() + s.slice(1)</span>
<span class="hljs-comment">// (Default: trailingCase: &#x27;unchanged&#x27;, leadingAdjustment: &#x27;auto&#x27;)</span>
str.<span class="hljs-title function_">toLocaleCapitalize</span>(locale);
<span class="hljs-comment">// &quot;cielo claro&quot; (&#x27;es&#x27;)     -&gt; &quot;Cielo claro&quot;</span>
<span class="hljs-comment">// &quot;«bonjour»&quot; (&#x27;fr&#x27;)       -&gt; &quot;«Bonjour»&quot;</span>
<span class="hljs-comment">// &quot;\u2068lundi\u2069&quot;      -&gt; &quot;\u2068Lundi\u2069&quot;</span>
<span class="hljs-comment">// &quot;ijsland&quot; (&#x27;nl&#x27;)         -&gt; &quot;IJsland&quot;</span>
<span class="hljs-comment">// &quot;&#x27;s-Gravenhage&quot; (&#x27;nl&#x27;)   -&gt; &quot;&#x27;s-Gravenhage&quot;</span>
<span class="hljs-comment">// &quot;თბილისი&quot; (&#x27;ka&#x27;)         -&gt; &quot;თბილისი&quot; (no-op!)</span>
<span class="hljs-comment">// &quot;ǆep&quot; (&#x27;hr&#x27;)             -&gt; &quot;ǅep&quot;</span>

<span class="hljs-comment">// 2. Composes with Intl.Segmenter for 1KB userland Title Case:</span>
<span class="hljs-keyword">const</span> segs = <span class="hljs-keyword">new</span> <span class="hljs-title class_">Intl</span>.<span class="hljs-title class_">Segmenter</span>(locale, { <span class="hljs-attr">granularity</span>: <span class="hljs-string">&#x27;word&#x27;</span> });
<span class="hljs-keyword">let</span> out = <span class="hljs-string">&#x27;&#x27;</span>;
<span class="hljs-keyword">for</span> (<span class="hljs-keyword">const</span> { segment, isWordLike } <span class="hljs-keyword">of</span> segs.<span class="hljs-title function_">segment</span>(str)) {
  out += isWordLike &amp;&amp; !<span class="hljs-variable constant_">STOP</span>.<span class="hljs-title function_">has</span>(segment.<span class="hljs-title function_">toLocaleLowerCase</span>(locale))
    ? segment.<span class="hljs-title function_">toLocaleCapitalize</span>(locale, { <span class="hljs-attr">trailingCase</span>: <span class="hljs-string">&#x27;lower&#x27;</span> })
    : segment;
}
</code></pre>
</div>
<div>
<h3 id="resolves-all-4-tg2-vendor-objections">Resolves All 4 TG2 Vendor Objections</h3>
<ol>
<li><strong>Why not CSS-only?</strong> Non-CSS sinks (<code>&lt;title&gt;</code>, <code>&lt;option&gt;</code>, <code>aria-label</code>, <code>&lt;canvas&gt;</code>, <code>Notification</code>), MF2 functions (<code>message-format-wg#38</code>), and avoiding <code>accname</code>/clipboard leaks.</li>
<li><strong><code>MacDonald</code> &amp; <code>iPhone</code> preserved:</strong> Default <code>trailingCase: 'unchanged'</code> never lowercases <code>&quot;MacDonald&quot;</code>, <code>&quot;iPhone&quot;</code>, <code>&quot;COVID-19&quot;</code>, or <code>&quot;España&quot;</code>.</li>
<li><strong>Zero <code>BreakIterator</code> regression:</strong> Single-span default (<code>U_TITLECASE_WHOLE_STRING</code> / <code>ICU4X titlecase_segment</code>) requires <strong>no word segmenter</strong>, avoiding Blink's 4.3% Speedometer 3 regression.</li>
<li><strong>Stop words stay in userland:</strong> Style-guide rules (AP vs. Chicago) don't bloat browser engines; method name avoids the overloaded term <code>&quot;titleCase&quot;</code>.</li>
</ol>
</div>
</div>
<footer>Capitalization, Titlecasing, and Presentational Case Mapping — W3C TPAC 2026</footer>

<h2 id="summary-matching-each-use-case-to-the-right-tool">Summary: Matching Each Use Case to the Right Tool</h2>
<table>
<thead>
<tr>
<th style="text-align:left">Real-World Use Case (from GitHub Study)</th>
<th style="text-align:left">Broken Code Today</th>
<th style="text-align:left">Proposed Platform Solution</th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:left"><strong>Declarative UI headings, chips, badges, inline <code>&lt;span&gt;</code>s, translated labels</strong> (<code>$t('...')</code>, status labels)</td>
<td style="text-align:left"><code>text-transform: capitalize</code> (forces every-word casing onto <code>fr</code>/<code>es</code>/<code>no</code>) or block-only <code>::first-letter</code></td>
<td style="text-align:left"><strong>CSS <code>text-transform: first-word</code> / <code>sentence</code> (<code>#8893</code>)</strong> + engine tailoring &amp; <code>accname</code> fixes</td>
</tr>
<tr>
<td style="text-align:left"><strong><code>Intl</code> dates, months, weekdays, languages, relative time in headers &amp; menus</strong></td>
<td style="text-align:left"><code>cap(date.toLocaleDateString(...))</code> or CSS <code>.capitalize</code> (ignores <code>sv</code>/<code>fr</code>/<code>cs</code> <code>no-change</code> rules)</td>
<td style="text-align:left"><strong><code>Intl</code> <code>{ capitalization: 'standalone' | 'ui-list-or-menu' | ... }</code> (<code>ecma402#355</code>)</strong> + CLDR <code>&lt;contextTransforms&gt;</code> audit</td>
</tr>
<tr>
<td style="text-align:left"><strong>Non-<code>Intl</code> strings in JS: toasts, API phrases (<code>weather.description</code>), MF2, <code>&lt;title&gt;</code>, <code>&lt;option&gt;</code>, <code>aria-label</code></strong></td>
<td style="text-align:left"><code>s.charAt(0).toUpperCase() + s.slice(1)</code> (breaks <code>ka</code>, <code>nl</code> <code>IJ</code>/<code>'s-</code>, <code>tr</code> <code>İ</code>, <code>Lt</code> digraphs, surrogates, <code>«</code>/<code>¿</code>, <code>U+2068</code>)</td>
<td style="text-align:left"><strong>JS First-Word / Segment Capitalization Primitive (<code>ecma402#294</code>)</strong> (<code>trailingCase: 'unchanged'</code> default)</td>
</tr>
<tr>
<td style="text-align:left"><strong>Editorial Title Case</strong> (English AP / Chicago headlines skipping stop words)</td>
<td style="text-align:left">Naive <code>.replace(/\b\w/g, ...)</code> (<code>&quot;éClair&quot;</code>, <code>&quot;Don'T&quot;</code>, <code>&quot;FogãO&quot;</code>)</td>
<td style="text-align:left"><strong>Userland library</strong> composing <code>Intl.Segmenter</code> + JS segment primitive (<code>#294</code>)</td>
</tr>
<tr>
<td style="text-align:left"><strong>Person names &amp; initials</strong> (<code>nombre</code>, <code>prenom</code>, <code>isim</code>)</td>
<td style="text-align:left"><code>name.split(' ').map(w =&gt; w[0].toUpperCase() + w.slice(1).toLowerCase())</code></td>
<td style="text-align:left"><strong>Do not case-normalize names (<code>no-change</code>)</strong>; use <strong>UTS #35 Part 8 (<code>initialPattern</code>)</strong> for initials</td>
</tr>
</tbody>
</table>
<footer>Capitalization, Titlecasing, and Presentational Case Mapping — W3C TPAC 2026</footer>

<h1 id="discussion-questions-for-the-breakout">Discussion Questions for the Breakout</h1>
<ol>
<li><strong>Architecture &amp; Division of Labor:</strong> Do we agree on the cross-layer split:
<ul>
<li><strong><code>Intl</code> (<code>#355</code>)</strong> for category-aware Phase 1 + 2 (<code>&lt;contextTransforms&gt;</code>)</li>
<li><strong>CSS (<code>#8893</code>) &amp; JS (<code>#294</code>)</strong> for Phase 2 first-word / segment titlecasing (<code>trailingCase: 'unchanged'</code>)</li>
<li><strong>Userland (via <code>Intl.Segmenter</code> + <code>#294</code>)</strong> for style-guide editorial title case?</li>
</ul>
</li>
<li><strong>CSS (<code>css-text</code>):</strong> Can we advance <code>text-transform: first-word</code> / <code>sentence</code> (<code>#8893</code>), align <code>nl</code>/<code>ga</code> tailorings, and resolve <code>accname#239</code> / clipboard leaks?</li>
<li><strong>JS &amp; <code>Intl</code> (<code>#355</code> &amp; <code>#294</code>):</strong> Can we advance <code>{ capitalization }</code> on <code>Intl</code> formatters (default <code>'middle-of-sentence'</code>) and a single-span capitalization primitive in JS (default <code>trailingCase: 'unchanged'</code>)?</li>
<li><strong>CLDR &amp; ICU Upstream:</strong> Auditing missing <code>&lt;contextTransforms&gt;</code> flags (<code>pt</code> months, <code>fr</code>/<code>es</code>/<code>it</code> relative, <code>pl</code>/<code>hu</code>/<code>ro</code>/<code>ca</code> languages), ICU4C <code>RelativeDateTimeFormatter</code>, and Irish (<code>ga</code>) / Dutch elision (<code>'s-</code>) rules.</li>
</ol>
